<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b57">
<link rel="manifest" href="manifest.webmanifest">
<title>Park4Night ID</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#17201d;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:auto;padding:22px 16px 40px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 20px #00000012;margin-bottom:16px}
h1{font-size:26px;margin:0 0 7px}h2{font-size:18px;margin:0 0 12px}p{color:#5c6763;line-height:1.45}
input{width:100%;font-size:17px;padding:14px;border:1px solid #cbd5d1;border-radius:12px;margin:7px 0 10px;background:#fff}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#0b6b57;color:#fff;font-size:16px;font-weight:700;margin-top:8px}
button.secondary{background:#e7eeeb;color:#174b40}.result{margin-top:16px;padding:16px;border-radius:14px;background:#f0f7f4;border:1px solid #d7e8e1}
.id{font-size:34px;font-weight:850;margin:4px 0 8px}.small{font-size:13px;color:#68736f}
.status{min-height:22px;margin-top:10px;font-size:14px}.ok{color:#087653}.err{color:#a52b2b}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🔎 Park4Night ID</h1>
<p>Obtén rápidamente el ID de una ficha de Park4Night.</p>
<h2>1. Pegar una URL</h2>
<input id="url" placeholder="https://park4night.com/es/place/40451" autocomplete="off">
<button onclick="extract()">Obtener ID</button>
<button class="secondary" onclick="paste()">📋 Pegar desde portapapeles</button>
<div id="result"></div>
<div id="status" class="status"></div>
</div>

<div class="card">
<h2>2. Buscar por nombre</h2>
<input id="name" placeholder="Ej.: Área de Barbantes" autocomplete="off">
<button onclick="searchName()">🔎 Buscar en Park4Night</button>
</div>

<div class="card">
<p class="small"><b>Consejo:</b> en Park4Night pulsa Compartir → Copiar enlace. Después vuelve aquí y usa “Pegar desde portapapeles”.</p>
<p class="small">La extracción del ID se hace localmente en tu dispositivo.</p>
</div>
</main>
<script>
const re=/park4night\.com\/(?:[a-z]{2}\/)?place\/(\d+)/i;
function setStatus(t,ok=false){const s=document.getElementById('status');s.textContent=t;s.className='status '+(ok?'ok':'err')}
function extract(text){
 text=text??document.getElementById('url').value.trim();
 const m=text.match(re), box=document.getElementById('result');
 if(!m){box.innerHTML='';setStatus('No encuentro un ID en esa URL.');return}
 const id=m[1];
 box.innerHTML=`<div class="result"><div class="small">ID Park4Night</div><div class="id">#${id}</div><button onclick="copyId('${id}')">📋 Copiar ID</button><button class="secondary" onclick="location.href='https://park4night.com/es/place/${id}'">🔗 Abrir ficha</button></div>`;
 setStatus('ID encontrado correctamente.',true);
}
async function paste(){
 try{
   const t=await navigator.clipboard.readText();
   document.getElementById('url').value=t;
   extract(t);
 }catch(e){setStatus('Android no permite leer el portapapeles automáticamente. Pega la URL en el campo superior.')}
}
async function copyId(id){
 try{await navigator.clipboard.writeText(id);setStatus('ID copiado: #'+id,true)}
 catch(e){setStatus('No se pudo copiar automáticamente. Mantén pulsado el ID para copiarlo.')}
}
function searchName(){
 const q=document.getElementById('name').value.trim(); if(!q)return;
 location.href='https://www.google.com/search?q='+encodeURIComponent('site:park4night.com/es/place "'+q+'"');
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
